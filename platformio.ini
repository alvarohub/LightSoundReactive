; Sound-reactive light show for the M5StickC Plus2.
; Mic -> FFT -> spectrum on the LCD, per-channel frequency windows -> PWM on
; G32 / G33 / G26 (R / G / B).
;
;   pio run                                          build (ESP-DSP, default)
;   pio run -t upload                                flash
;   pio device monitor                               serial output
;
;   pio run -e m5stick-c-plus2-arduinodft             build with arduinoFFT
;   pio run -e m5stick-c-plus2-arduinodft -t upload   flash that variant
;
; See README.md for wiring and the web UI.

[env:m5stick-c-plus2]
platform = espressif32@6.12.0
board = m5stick-c-plus2
framework = arduino
board_build.partitions = default_8MB.csv
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    m5stack/M5Unified@^0.2.27

; M5Unified needs C++17. The FFT backend is chosen at compile time.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DFFT_BACKEND_ESP_DSP

; Alternative FFT backend: arduinoFFT instead of ESP-DSP. Same firmware, same
; behaviour; the ESP-DSP one is faster and needs no extra dependency.
;
; NOTE arduinoFFT is GPL-3.0, so a binary built from this environment is GPL-3.0.
; The default environment above contains only Apache-2.0 and MIT code.
[env:m5stick-c-plus2-arduinodft]
extends = env:m5stick-c-plus2
build_flags =
    -std=gnu++17
    -DFFT_BACKEND_ARDUINO_FFT
lib_deps =
    ${env:m5stick-c-plus2.lib_deps}
    kosme/arduinoFFT@^2.0.4
